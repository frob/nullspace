baseURL: 'https://nullspace.dev/'
title: 'Nullspace'
languageCode: 'en-us'
defaultContentLanguage: 'en'

# Hugo Book theme via Hugo Modules. The module is fetched by `hugo mod get`
# during the docs Docker build, so it stays in sync without git submodules.
module:
  imports:
    - path: 'github.com/alex-shpak/hugo-book'

disableKinds:
  - taxonomy

sectionPagesMenu: 'main'

outputs:
  home:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: 'github'
    noClasses: false
    lineNos: false
    tabWidth: 2
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

params:
  # Render every top-level section under content/ in the sidebar, not just
  # one "docs/" tree. Diataxis splits content across seven sections.
  BookSection: '/'

  BookTheme: 'auto'
  BookToC: true
  BookLogo: ''
  BookRepo: 'https://github.com/frob/nullspace'
  BookEditPath: 'edit/0.0.x/docs'
  BookDateFormat: 'January 2, 2006'
  BookSearch: false
  BookComments: false
  BookPortableLinks: true
  BookServiceWorker: false

menu:
  after:
    - name: 'GitHub'
      url: 'https://github.com/frob/nullspace'
      weight: 10
