<!DOCTYPE html>
<html>
<head>
    <title>{{.Title}} — Nullspace Example</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/posts">Posts</a>
        <a href="/forms/contact">Contact</a>
    </nav>
    <h1>{{.Title}}</h1>
    <form method="POST" action="{{.Action}}">
        {{range .Fields}}
        <div style="margin-bottom: 1rem;">
            <label for="{{.Name}}"><strong>{{.Label}}</strong>
                {{if .Required}}<span style="color: red;">*</span>{{end}}
            </label><br>
            {{if eq .Type "textarea"}}
                <textarea id="{{.Name}}" name="{{.Name}}" rows="5"
                    style="width: 100%; max-width: 500px;">{{index $.Values .Name}}</textarea>
            {{else if eq .Type "select"}}
                <select id="{{.Name}}" name="{{.Name}}" style="width: 100%; max-width: 500px;">
                    <option value="">-- select --</option>
                    {{range .Options}}
                        <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            {{else}}
                <input id="{{.Name}}" name="{{.Name}}" type="{{.Type}}"
                    value="{{index $.Values .Name}}"
                    style="width: 100%; max-width: 500px;">
            {{end}}
            {{with index $.Errors .Name}}
                <div style="color: red; font-size: 0.9rem;">{{.}}</div>
            {{end}}
        </div>
        {{end}}
        <button type="submit" style="padding: 0.5rem 1.5rem;">Submit</button>
    </form>
</body>
</html>
